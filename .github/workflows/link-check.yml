# ABOUTME: Weekly + on-PR link check across the repo using lychee. Opens an issue
# ABOUTME: when the scheduled run finds broken links so the maintainer queue is signal-rich.

name: link-check

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"
  schedule:
    - cron: "0 12 * * 1"  # Mondays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Install lychee
        run: |
          echo "=== Installing lychee ===" && \
          curl -sL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.18.1/lychee-x86_64-unknown-linux-musl.tar.gz \
            | tar xz -C /usr/local/bin && \
          lychee --version

      - name: Run lychee
        id: lychee
        run: |
          lychee \
            --cache \
            --max-cache-age 1d \
            --no-progress \
            --accept 200,206,301,302,403,429 \
            --timeout 30 \
            --max-retries 3 \
            --output ./lychee-out.md \
            './**/*.md'

      - name: Post report on PR failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try {
              body = fs.readFileSync('./lychee-out.md', 'utf8').trim();
            } catch(e) {
              body = '`lychee-out.md` was not created — lychee likely failed before writing output.';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Lychee link-check output\n\n\`\`\`\n${body || '(empty)'}\n\`\`\``
            });

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: ./lychee-out.md

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links detected (scheduled link-check)"
          content-filepath: ./lychee-out.md
          labels: broken-link, automated
