# ABOUTME: Weekly + on-PR link check across the repo using lychee. Opens an issue
# ABOUTME: when the scheduled run finds broken links so the maintainer queue is signal-rich.

name: link-check

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"
  schedule:
    - cron: "0 12 * * 1"  # Mondays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Install lychee
        run: |
          set -euo pipefail
          # Get browser_download_url directly to avoid constructing it from the tag name
          # (lychee tags look like "lychee-v0.24.2" but the tarball filename uses "0.24.2")
          LYCHEE_URL=$(curl -sSf "https://api.github.com/repos/lycheeverse/lychee/releases/latest" \
            | jq -r '
                .assets[]
                | select(.name | test("x86_64-unknown-linux-musl\\.tar\\.gz$"))
                | .browser_download_url
              ' | head -1)
          [ -n "$LYCHEE_URL" ] || { echo "Failed to find lychee download URL"; exit 1; }
          echo "Downloading lychee from ${LYCHEE_URL}"
          TMP=$(mktemp -d)
          curl -sSfL "$LYCHEE_URL" | tar xz -C "$TMP"
          LYCHEE_BIN=$(find "$TMP" -name lychee -type f | head -1)
          [ -n "$LYCHEE_BIN" ] || { echo "lychee binary not found in archive"; ls "$TMP"; exit 1; }
          sudo install -m 755 "$LYCHEE_BIN" /usr/local/bin/lychee
          rm -rf "$TMP"
          lychee --version

      - name: Run lychee
        id: lychee
        run: |
          lychee \
            --config ./lychee.toml \
            --cache \
            --max-cache-age 1d \
            --no-progress \
            --insecure \
            --accept 200,206,301,302,403,429 \
            --timeout 30 \
            --max-retries 3 \
            --output ./lychee-out.md \
            './**/*.md'
        # 403: some sites (e.g. Google Groups) block automated agents but remain browser-accessible
        # --insecure: kubernetes.io TLS cert fails verification on ubuntu-latest CI runner

      - name: Post report on PR failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try {
              body = fs.readFileSync('./lychee-out.md', 'utf8').trim();
            } catch(e) {
              if (e.code === 'ENOENT') {
                body = '`lychee-out.md` was not created — lychee likely failed before writing output.';
              } else {
                body = `Error reading lychee-out.md: ${e.message}`;
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Lychee link-check output\n\n<details><summary>Full report</summary>\n\n${body || '(empty)'}\n\n</details>`
            });

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: ./lychee-out.md

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links detected (scheduled link-check)"
          content-filepath: ./lychee-out.md
          labels: broken-link, automated
